# Vyora API CI — independent of the web pipeline.
#
# Deliberately a separate workflow with a separate name. `CI` and
# `Deploy Production` are untouched, so whatever branch protection or release
# approval is attached to them keeps referring to exactly the same checks it did
# before. A new required check is a decision for a human, not a side effect of
# adding a workflow file.
#
# Path-filtered: the API suite needs a PostgreSQL service and takes minutes, and
# a change to `app/` cannot break it.
name: API CI

on:
  push:
    paths:
      - "vyora-api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "vyora-api/**"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

# Two pushes to the same branch need not both finish.
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Contract · Type Check · Test (PostgreSQL 16)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vyora-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Without this the first migration races the server's own startup and
        # fails intermittently — the worst kind of CI failure to diagnose.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Loopback, because the API refuses to start against anything else.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vyora
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vyora_test
      NODE_ENV: test
      VYORA_DEV_AUTH: "true"
      SYNC_CURSOR_SECRET: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      # Node 24 LTS — the runtime the API was actually validated against
      # locally (v24.19.0). Pinning CI to a version nobody ran the suite on
      # would make a green build weaker evidence than it looks.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: vyora-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fresh databases every run, so "migrates from empty" is what CI actually
      # exercises rather than something only the test suite claims.
      - name: Create fresh databases
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS vyora;" \
            -c "DROP DATABASE IF EXISTS vyora_test;" \
            -c "CREATE DATABASE vyora;" \
            -c "CREATE DATABASE vyora_test;"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Type check
        run: npm run type-check

      # Structural validity of the contract itself.
      - name: Contract lint
        run: npm run contract:lint

      # Bundling resolves every $ref. A dangling reference passes a lint that
      # never followed it, and then fails at runtime when a schema is compiled.
      - name: Contract bundle
        run: npx redocly bundle openapi/openapi.yaml -o /tmp/openapi.bundled.yaml

      # Fails on undocumented routes and on contract/implementation parity
      # drift: tests/contract.test.ts compares the registered routes against the
      # contract's operations in BOTH directions, so an endpoint that exists but
      # is not in openapi.yaml fails just as loudly as one that is missing.
      - name: Test
        run: npm test

      - name: Report
        if: always()
        run: |
          echo "### Vyora API CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL 16 service container" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations applied to a fresh database" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract linted and bundled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Route/contract parity asserted in both directions" >> "$GITHUB_STEP_SUMMARY"
