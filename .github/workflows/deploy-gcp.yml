# Esytol → the shared GCP platform.
#
# Replaces the Vercel deployment path. `deploy-production.yml` is deliberately
# left in place and untouched until the cutover hold period ends: until DNS
# moves, Vercel is still production, and deleting its workflow first would
# remove the rollback that makes the cutover safe.
#
# ## What holds this together
#
# **No commit deploys itself.** No `push` trigger. A human publishes a release
# or dispatches manually, and the `production` Environment holds the deploy job
# until a reviewer approves it.
#
# **No long-lived credential exists.** Workload Identity Federation exchanges
# GitHub's per-run OIDC token for a short-lived GCP token. There is no service
# account JSON key and no SSH private key in this repository's secrets. SSH
# reaches the VM through IAP, so port 22 is not open to the internet.
#
# **Images are immutable.** Tagged by commit SHA, never `latest`, so "which
# build is running" has an answer and rollback is re-running this workflow with
# an older SHA.
#
# **Esytol deploys alone.** `docker compose up -d esytol` restarts one
# container. A website release must never interrupt a merchant mid-sync, and
# PostgreSQL is never restarted for an application deploy.
name: Deploy to GCP

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA to deploy (full 40 characters)"
        required: true
        type: string
      confirm:
        description: 'Type "deploy to production" to proceed'
        required: true
        type: string

concurrency:
  # Never two deploys at once, and never cancel one in flight.
  group: esytol-gcp-deploy
  cancel-in-progress: false

# ## Where the GCP identifiers live
#
# In this file, not in repository secrets. The first dispatch failed at the
# first authentication step ("must specify exactly one of
# workload_identity_provider or credentials_json") because the repository had
# no secrets set, so every `secrets.GCP_*` was empty. The API's deploy workflow
# hit the same failure and settled the same way.
#
# None of these five values is a credential: a project id, a WIF provider path,
# a service-account email, a VM name and a zone. What stops anyone else using
# them lives in GCP and is unchanged:
#   * the provider's attribute condition, assertion.repository_owner=='EasyTechLabs'
#   * esytol-deployer's workloadIdentityUser binding, restricted to
#     principalSet://.../attribute.repository/EasyTechLabs/esytol
env:
  GCP_PROJECT: esytol-platform
  GCP_WIF_PROVIDER: projects/1055892026226/locations/global/workloadIdentityPools/github-pool/providers/github
  GCP_DEPLOYER_SA: esytol-deployer@esytol-platform.iam.gserviceaccount.com
  GCP_VM_NAME: esytol-platform-vm
  GCP_VM_ZONE: asia-south1-a
  REGION: asia-south1
  REPOSITORY: platform
  IMAGE: esytol
  # The canonical site. NEXT_PUBLIC_* values are inlined at BUILD time, so this
  # is a build argument — changing it requires a new image, not a restart.
  SITE_URL: https://esytol.com

jobs:
  verify:
    name: Verify the commit being deployed
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unconfirmed run
        if: inputs.confirm != 'deploy to production'
        run: |
          echo "::error::Confirmation phrase not given. Nothing was deployed."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

  build:
    name: Build and push the image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC token WIF exchanges. Without it the token is
      # never minted and authentication fails closed.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Pool and provider are pinned to EasyTechLabs/esytol by an attribute
          # condition on the GCP side. A provider that trusts the GitHub issuer
          # without one can be impersonated from ANY repository on GitHub.
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ inputs.ref }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            NEXT_PUBLIC_SITE_NAME=Esytol
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # The approval gate. Configure required reviewers on this Environment —
    # without them this job runs unattended, which is what the workflow exists
    # to prevent.
    environment:
      name: production
      url: https://esytol.com

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy over IAP
        run: |
          set -euo pipefail
          IMAGE_REF="${REGION}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${REPOSITORY}/${IMAGE}:${{ inputs.ref }}"

          # OS Login can authorise a fresh certificate a few seconds before
          # sshd accepts it. Retry only the read-only probe below, never the
          # deploy itself.
          ssh_retry() {
            local what="$1"; shift
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if "$@"; then
                return 0
              fi
              echo "::notice::${what} attempt ${attempt} failed (OS Login may still be propagating); retrying in 15s"
              sleep 15
            done
            echo "::error::${what} failed after 6 attempts"
            return 1
          }

          # No public SSH: the tunnel is authorised by IAM, not by a firewall
          # rule scoped to an address. The SSH certificate expires within the
          # hour; no key outlives the run.
          SSH=("${{ env.GCP_VM_NAME }}" --zone "${{ env.GCP_VM_ZONE }}"
               --tunnel-through-iap --quiet --ssh-key-expire-after=1h)

          ssh_retry "ssh probe" gcloud compute ssh "${SSH[@]}" --command "true"

          # Docker through sudo. The deployer is granted OS Admin Login on this
          # one VM and is deliberately NOT in the docker group: membership there
          # is root that never expires and is not audited, while sudo is logged
          # and tied to the run's short-lived certificate. Root's Docker already
          # pulls from Artifact Registry with the VM's own identity, and the
          # compose file's env_file (/etc/esytol/app.env) is root-only.
          gcloud compute ssh "${SSH[@]}" --command "set -euo pipefail
              cd /opt/vyora
              sudo docker pull '${IMAGE_REF}'
              # One service. Vyora and PostgreSQL are not touched.
              sudo ESYTOL_IMAGE='${IMAGE_REF}' docker compose -f docker-compose.production.yml up -d --no-deps esytol
              for i in \$(seq 1 30); do
                if sudo docker compose -f docker-compose.production.yml exec -T esytol \
                     node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"; then
                  echo \"healthy after \${i} attempt(s)\"
                  echo \"running: \$(sudo docker inspect --format '{{.Config.Image}}' \$(sudo docker compose -f docker-compose.production.yml ps -q esytol))\"
                  exit 0
                fi
                sleep 2
              done
              echo 'esytol did not become healthy'; exit 1"

      - name: Verify from the internet
        run: |
          set -euo pipefail
          # Through DNS and TLS — the path a visitor actually takes.
          status=$(curl -fsS -o /tmp/health.json -w '%{http_code}' https://esytol.com/api/v1/health)
          echo "HTTP ${status}"; cat /tmp/health.json
          test "${status}" = "200"

      - name: Confirm www redirects to the canonical host
        run: |
          set -euo pipefail
          # A second origin serving the same pages would split every SEO signal.
          location=$(curl -sS -o /dev/null -w '%{redirect_url}' https://www.esytol.com/)
          echo "www → ${location}"
          case "${location}" in https://esytol.com/*) ;; *) exit 1 ;; esac
