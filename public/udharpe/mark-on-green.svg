<!--
  UDHARPE — the mark reversed out of the primary green, for an app icon or any
  place the mark sits on the brand colour rather than on paper.

  Same geometry as mark.svg; the leaves become paper and the ground becomes
  green, so the ledger reads as a page held against the brand rather than as a
  green shape on a page.
-->
