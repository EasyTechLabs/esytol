<!--
  UDHARPE — the compact mark.

  An open ledger: two leaves, a dark binding spine, ruled entry lines on each
  side, and a single confirmation bead where the two sides meet. The left leaf
  is the shop's record, the right the customer's acknowledgement; the bead is
  the agreement that makes the entry real.

  Generated by Stitch (project 2369893755165512883, design system
  assets/6728907655515493824) and exported here unchanged in geometry. Nothing
  about it was redrawn by hand.

  Deliberately absent: no rupee symbol, no coin, no card, no wallet, no bank.
  Those say payments. UDHARPE records what two people agreed and moves no money.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none" role="img" aria-label="Udharpe">
  <title>Udharpe</title>
  <!-- Central spine / ledger binding rule -->
  <rect x="17" y="5" width="2" height="26" rx="1" fill="#1A1A17" />
  <!-- Left leaf: the shop's record -->
  <path d="M7 8C7 6.89543 7.89543 6 9 6H15V30H9C7.89543 30 7 29.1046 7 28V8Z" fill="#0E6F5C" />
  <!-- Right leaf: the customer's acknowledgement -->
  <path d="M21 6H27C28.1046 6 29 6.89543 29 8V28C29 29.1046 28.1046 30 27 30H21V6Z" fill="#0E6F5C" />
  <!-- Ruled entry lines, both sides -->
  <line x1="10" y1="12" x2="13" y2="12" stroke="#FBFAF7" stroke-width="1.5" stroke-linecap="round" />
  <line x1="10" y1="17" x2="13" y2="17" stroke="#FBFAF7" stroke-width="1.5" stroke-linecap="round" />
  <line x1="23" y1="12" x2="26" y2="12" stroke="#FBFAF7" stroke-width="1.5" stroke-linecap="round" />
  <line x1="23" y1="17" x2="26" y2="17" stroke="#FBFAF7" stroke-width="1.5" stroke-linecap="round" />
  <!-- The confirmation bead: both sides agreed -->
  <circle cx="18" cy="23" r="2.2" fill="#FBFAF7" />
  <circle cx="18" cy="23" r="1.2" fill="#1A1A17" />
</svg>
