<!--
  UDHARPE — the U monogram, for a favicon and anywhere too small for the ledger.

  The U is two stems meeting in one curve: the two sides arriving at the same
  record. A dashed rule runs down the middle where the ledger's centre line
  would be, and the brass bead at the vertex is the same confirmation dot as in
  the full mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Udharpe">
  <title>Udharpe</title>
  <rect width="32" height="32" rx="6" fill="#0E6F5C" />
  <path d="M8 7V17C8 21.4183 11.5817 25 16 25C20.4183 25 24 21.4183 24 17V7" stroke="#FBFAF7" stroke-width="3.6" stroke-linecap="round" />
  <line x1="16" y1="11" x2="16" y2="21" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3" />
  <circle cx="16" cy="25" r="2.2" fill="#B77B2B" />
</svg>
