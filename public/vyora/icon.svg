<!--
  Udharpe — the installed web app's icon.

  The file keeps its `/vyora/` path on purpose. A browser keys an installed PWA
  on the manifest's `id` and `scope`, and the icon is referenced from that
  manifest; moving these files means editing the manifest, and editing `id` or
  `scope` makes every phone that has installed this treat the next visit as a
  different app — losing the install and the data behind it. The path is an
  address. The artwork is the brand, and the artwork is what changed.

  It used to be a blue "V". It is now the ledger mark: two leaves, a binding
  spine, ruled entry lines, and the brass bead where both sides agree —
  generated by Stitch for project 2369893755165512883 and identical to the
  Android launcher icon and Esytol's own mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Udharpe">
  <title>Udharpe</title>
  <rect width="512" height="512" rx="112" fill="#0E6F5C"/>
  <g transform="translate(96, 96) scale(8.889)">
    <rect x="17" y="5" width="2" height="26" rx="1" fill="#0A5647"/>
    <path d="M7 8C7 6.89543 7.89543 6 9 6H15V30H9C7.89543 30 7 29.1046 7 28V8Z" fill="#FBFAF7"/>
    <path d="M21 6H27C28.1046 6 29 6.89543 29 8V28C29 29.1046 28.1046 30 27 30H21V6Z" fill="#FBFAF7"/>
    <line x1="10" y1="12" x2="13" y2="12" stroke="#0E6F5C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="17" x2="13" y2="17" stroke="#0E6F5C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="12" x2="26" y2="12" stroke="#0E6F5C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="17" x2="26" y2="17" stroke="#0E6F5C" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="18" cy="23" r="2.2" fill="#B77B2B"/>
    <circle cx="18" cy="23" r="1.2" fill="#0A5647"/>
  </g>
</svg>
